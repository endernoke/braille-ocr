[project]
name = "ocr-backend"
version = "0.1.0"
description = "ML OCR backend with FastAPI and Celery"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pillow>=12.1.1",  # Shared between API and worker
]

[project.optional-dependencies]
api = [
    "fastapi>=0.128.8",
    "python-multipart>=0.0.22",
    "redis>=6.4.0",
    "uvicorn>=0.40.0",
    "celery[redis]>=5.6.2",  # Only celery client, not worker-specific deps
]
worker = [
    "celery[redis]>=5.6.2",
    "numpy>=2.4.2",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]
