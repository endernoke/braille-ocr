services:
  redis:
    image: redis:7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    container_name: redis
    profiles: [app, training]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api
    profiles: [app]
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src
      - uploads:/app/uploads
      - results:/app/results
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - network
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        - OCR_MODEL_PATH=${OCR_MODEL_PATH}
        - CLASSIFIER_MODEL_PATH=${CLASSIFIER_MODEL_PATH}
    container_name: worker
    profiles: [app]
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src
      - uploads:/app/uploads
      - results:/app/results
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - network
    restart: unless-stopped

    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    profiles: [app]
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - network
    restart: unless-stopped

  training:
    build:
      context: .
      dockerfile: ./training/Dockerfile
    container_name: training
    profiles: [training]
    environment:
      - DEVICE=cuda
    volumes:
      - ./training:/app/training
      - ./backend/src:/app/backend/src
      - ./data:/data
      - models:/app/models
    depends_on:
      - redis
    networks:
      - network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  network:
    driver: bridge

volumes:
  redis_data:
  uploads:
  results:
  models:
